name: Generate GitHub Profile Trophy

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  trophy:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Guisilva29
          output: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Trophy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: .
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
